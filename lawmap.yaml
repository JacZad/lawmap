# Mapa aktów prawnych o dostępności w Polsce: jedyne źródło danych.
# Z tego pliku powstają lawmap.mmd (schemat), lawmap.md (wersja tekstowa) i stan.json
# (status aktów sprawdzony w ELI). Opis pól: README.md.

meta:
  tytul: "Lawmap: dostępność cyfrowa i architektoniczna w Polsce"
  autor: Jacek Zadrożny
  opis: >-
    Mapa relacji między kluczowymi aktami prawnymi dotyczącymi dostępności w Polsce,
    od Konstytucji po normy techniczne.
  licencja: MIT

poziomy:
  - id: konstytucja
    nazwa: Konstytucja
  - id: miedzynarodowe
    nazwa: Prawo międzynarodowe i unijne
  - id: ustawy
    nazwa: Ustawy
  - id: rozporzadzenia
    nazwa: Rozporządzenia
  - id: normy
    nazwa: Normy i wytyczne

akty:
  # Konstytucja
  - id: konstytucja
    skrot: Konstytucja RP
    poziom: konstytucja
    typ: konstytucja
    eli: DU/1997/483

  # Prawo międzynarodowe i unijne
  - id: kpon
    skrot: Konwencja o prawach osób niepełnosprawnych
    poziom: miedzynarodowe
    typ: umowa_miedzynarodowa
    eli: DU/2012/1169
  - id: karta
    skrot: Karta praw podstawowych UE
    poziom: miedzynarodowe
    typ: traktat_ue
    celex: 12016P/TXT
    tytul: Karta praw podstawowych Unii Europejskiej
  - id: eaa
    skrot: Dyrektywa o dostępności produktów i usług (EAA)
    poziom: miedzynarodowe
    typ: dyrektywa_ue
    celex: 32019L0882
    tytul: >-
      Dyrektywa Parlamentu Europejskiego i Rady (UE) 2019/882 z dnia 17 kwietnia 2019 r.
      w sprawie wymogów dostępności produktów i usług
  - id: wad
    skrot: Dyrektywa o dostępności stron internetowych (WAD)
    poziom: miedzynarodowe
    typ: dyrektywa_ue
    celex: 32016L2102
    tytul: >-
      Dyrektywa Parlamentu Europejskiego i Rady (UE) 2016/2102 z dnia 26 października 2016 r.
      w sprawie dostępności stron internetowych i mobilnych aplikacji organów sektora publicznego
  - id: ue_loty
    skrot: Rozporządzenie o podróżach lotniczych
    poziom: miedzynarodowe
    typ: rozporzadzenie_ue
    celex: 32006R1107
    tytul: >-
      Rozporządzenie (WE) nr 1107/2006 z dnia 5 lipca 2006 r. w sprawie praw osób
      niepełnosprawnych oraz osób o ograniczonej sprawności ruchowej w podróżach lotniczych
  - id: ue_autobusy
    skrot: Rozporządzenie o transporcie autobusowym
    poziom: miedzynarodowe
    typ: rozporzadzenie_ue
    celex: 32011R0181
    tytul: >-
      Rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 181/2011 z dnia 16 lutego 2011 r.
      dotyczące praw pasażerów w transporcie autobusowym i autokarowym

