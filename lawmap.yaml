  # Rozporządzenia
  - id: w_budynki
    skrot: Warunki techniczne dla budynków
    poziom: rozporzadzenia
    typ: rozporzadzenie
    eli: DU/2002/690
    opis: Szczegółowe przepisy o dostępności budynków, w tym miejsca parkingowe.
    uwagi: >-
      ELI: uznany za uchylony od 2026-09-21 (art. 66 ustawy o zapewnianiu dostępności:
      przepisy wykonawcze do Prawa budowlanego zachowały moc najdłużej 84 miesiące).
      Nowego rozporządzenia w Dzienniku Ustaw nie znaleziono; wymaga wyjaśnienia.
  - id: w_metro
    skrot: Warunki techniczne dla metra
    poziom: rozporzadzenia
    typ: rozporzadzenie
    eli: DU/2023/1210
  - id: w_telekomunikacja
    skrot: Udogodnienia w usługach telefonicznych
    poziom: rozporzadzenia
    typ: rozporzadzenie
    eli: DU/2014/464
  - id: w_wybory
    skrot: Dostępność lokali wyborczych
    poziom: rozporzadzenia
    typ: rozporzadzenie
    eli: DU/2011/938
  - id: kri
    skrot: Krajowe Ramy Interoperacyjności
    poziom: rozporzadzenia
    typ: rozporzadzenie
    eli: DU/2024/773
    opis: Minimalne wymagania dla systemów teleinformatycznych, w tym w zakresie dostępności cyfrowej.
  - id: kri_2012
    skrot: Krajowe Ramy Interoperacyjności (2012)
    poziom: rozporzadzenia
    typ: rozporzadzenie
    eli: DU/2012/526
  - id: warunki_dd
    skrot: Warunki techniczne deklaracji dostępności
    poziom: rozporzadzenia
    typ: dokument_urzedowy
    tytul: Warunki techniczne publikacji oraz struktura dokumentu elektronicznego deklaracji dostępności
    opis: Udostępnia minister właściwy do spraw informatyzacji w BIP (art. 12 pkt 7 ustawy o dostępności cyfrowej); to nie jest rozporządzenie.

  # Normy i wytyczne
  - id: wcag21
    skrot: WCAG 2.1
    poziom: normy
    typ: norma
    tytul: Wytyczne dla dostępności treści internetowych 2.1
    url: https://www.w3.org/TR/WCAG21/
    opis: Załącznik do ustawy o dostępności cyfrowej.
  - id: en301549
    skrot: Norma EN 301 549
    poziom: normy
    typ: norma
    tytul: EN 301 549 Wymagania dostępności produktów i usług ICT
    opis: Ustawa o dostępności cyfrowej przywołuje pkt 9, 10 i 11 wersji V3.2.1:2021.
  - id: wytyczne_mfipr
    skrot: Wytyczne MFiPR (standardy dostępności)
    poziom: normy
    typ: wytyczne
    tytul: Wytyczne dotyczące realizacji zasad równościowych w ramach funduszy unijnych na lata 2021–2027
  - id: wytyczne_pfron
    skrot: Wytyczne PFRON
    poziom: normy
    typ: wytyczne
    tytul: >-
      Jak zapewnić dostępność produktów i usług. Wytyczne dla podmiotów gospodarczych
      w zakresie zapewniania spełniania wymagań dostępności produktów i usług
  - id: krrit_ad
    skrot: Rekomendacje KRRiT (audiodeskrypcja)
    poziom: normy
    typ: wytyczne
    tytul: Rekomendacje KRRiT dotyczące audiodeskrypcji (2015)
  - id: krrit_cc
    skrot: Rekomendacje KRRiT (napisy)
    poziom: normy
    typ: wytyczne
    tytul: Rekomendacje KRRiT dotyczące napisów dla niesłyszących (2016)
  - id: krrit_pjm
    skrot: Stanowisko KRRiT (tłumacz PJM)
    poziom: normy
    typ: wytyczne
    tytul: Stanowisko KRRiT w sprawie tłumaczenia na polski język migowy (2021)

